name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    env:
      # apps/api's tests hit a real (local, throwaway) SQLite DB via Prisma.
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: ci-test-secret
      WEB_ORIGIN: http://localhost:5173
      # Left unset: every AI call falls back to rule-based logic (see
      # CLAUDE.md), so CI needs no ANTHROPIC_API_KEY.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Seed demo data
        working-directory: apps/api
        run: pnpm run db:seed

      - name: Build (typecheck + compile all packages)
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Validate the Postgres Prisma schema
        working-directory: apps/api
        run: pnpm exec prisma validate --schema=prisma/schema.postgres.prisma
        env:
          # validate only checks schema syntax — no real connection is made.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/parishodh"

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        # test:e2e's own global-setup migrates and seeds a dedicated,
        # throwaway SQLite DB (apps/api/prisma/e2e.db) before the specs run.
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
